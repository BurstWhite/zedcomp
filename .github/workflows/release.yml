name: Release

# Only runs for version tags (`v0.1.0`, `v1.2.3-rc1`, ...). Pushes to `main`
# never publish a release -- see `.github/workflows/ci.yml` for those.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # One job per platform, each producing exactly one release asset. The asset
  # names are the contract with `src/lib.rs` (`asset_names` / `binary_names`):
  # `zedcomp-helper-<target-triple>`, except `.exe` on Windows, and both
  # uncompressed and `.gz` variants are accepted by the extension.
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            asset: zedcomp-helper-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-14
            asset: zedcomp-helper-x86_64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: zedcomp-helper-x86_64-unknown-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: zedcomp-helper-x86_64-pc-windows-msvc.exe
    steps:
      - uses: actions/checkout@v4

      # `targets:` runs `rustup target add` for us; macos-14 is arm64, so the
      # x86_64-apple-darwin binary is a cross build (the runner ships the SDK).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build helper
        run: >-
          cargo build --release --locked
          --target ${{ matrix.target }}
          --manifest-path helper/Cargo.toml

      - name: Stage release asset
        shell: bash
        run: |
          set -euo pipefail

          source_bin="helper/target/${{ matrix.target }}/release/zedcomp-helper"
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            source_bin="${source_bin}.exe"
          fi

          if [ ! -f "$source_bin" ]; then
            echo "::error::expected helper binary at $source_bin"
            exit 1
          fi

          mkdir -p dist
          cp "$source_bin" "dist/${{ matrix.asset }}"

          # Strip debug symbols on unix; `strip` cannot handle PE binaries.
          if [ "${{ matrix.target }}" != "x86_64-pc-windows-msvc" ]; then
            strip "dist/${{ matrix.asset }}"
          fi

          ls -l dist

      - name: Upload asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show assets
        run: ls -l dist

      # Creates (or updates) the release for the pushed tag and uploads every
      # asset, keeping the exact file names the extension looks up.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
