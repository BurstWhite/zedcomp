name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  helper-tests:
    name: helper tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `helper/` is its own workspace root (see helper/Cargo.toml).
      - name: cargo test
        run: cargo test --manifest-path helper/Cargo.toml

  extension-wasm:
    name: extension wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      # The root crate is the Zed extension; it must keep compiling for
      # wasm32-wasip2 for Zed to be able to load it.
      - name: cargo build (wasm32-wasip2)
        run: cargo build --release --target wasm32-wasip2 --manifest-path Cargo.toml

      - name: Check wasm artifact
        run: ls -l target/wasm32-wasip2/release/zedcomp_extension.wasm
